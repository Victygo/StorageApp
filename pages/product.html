<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Milk</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fondamento&family=Sansita+Swashed:wght@600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/styles/style.css">
  <link rel="stylesheet" href="/styles/pages.css">
</head>
<body class="inner">
  <main class="page details">
    <header class="topbar">
      <a class="back" href="list.html" aria-label="Back to list">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><polyline points="15 5 8 12 15 19"/></svg>
      </a>
      <h1 class="page-title">Product</h1>
    </header>

    <div class="details-layout">
      <section class="hero">
        <div class="emoji-big">🥛</div>
        <h2>Milk</h2>
        <span class="badge is-soon">Use soon</span>
      </section>

      <div>
        <section class="panel">
          <div class="freshness-row">
            <span>Freshness</span>
            <strong>3 days left</strong>
          </div>
          <div class="bar is-soon"><span style="width:43%"></span></div>
          <p class="note">Better to use it in the next few days.</p>
        </section>

        <section class="panel">
          <ul class="facts">
            <li><span class="label">Date added</span><span class="value">10 Oct 2026</span></li>
            <li><span class="label">Expiration date</span><span class="value">17 Oct 2026</span></li>
            <li><span class="label">Days in the fridge</span><span class="value">4 days</span></li>
            <li><span class="label">Category</span><span class="value">Dairy</span></li>
            <li><span class="label">Quantity</span><span class="value">1 L</span></li>
          </ul>
        </section>

        <div class="buttons">
          <a class="primary" href="#">Edit</a>
          <button class="btn-outline" type="button">Delete</button>
        </div>
      </div>
    </div>
  </main>
</body>
</html>
